name: Bootstrap

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_bootstrap.py"
      - ".github/workflows/bootstrap.yml"
  pull_request:
    paths:
      - "scripts/build_bootstrap.py"
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:
  schedule:
    # Termux packages move; rebuild weekly so the pinned versions stay usable.
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  bootstrap:
    name: Build toolchain bootstrap
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;27.3.13750724" "platform-tools"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - name: Build bootstrap
        run: |
          python scripts/build_bootstrap.py \
            --ndk "$ANDROID_NDK_HOME" \
            --out app/src/main/assets/bootstrap-aarch64.bin

      - name: Summary
        run: |
          cat app/src/main/assets/bootstrap-aarch64.bin.json
          echo "### bootstrap: $(du -h app/src/main/assets/bootstrap-aarch64.bin | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bootstrap
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-aarch64
          path: app/src/main/assets/bootstrap-aarch64.bin
          if-no-files-found: error

      - name: Upload manifest
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-manifest
          path: app/src/main/assets/bootstrap-aarch64.bin.json
          if-no-files-found: error